name: deploy

on:
  push:
    branches: [main, rc]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

jobs:
  deploy-pypi:
    runs-on: ubuntu-latest
    # GitHub environment
    environment:
      name: release
      url: https://pypi.org/project/nvcs/
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Build
        run: |
          uv pip install --system setuptools setuptools_scm wheel
          python setup.py sdist bdist_wheel
      # Github Actions are added as Trusted Publisher for PyPI
      - name: Publish package to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true
          attestations: false
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
          attestations: false
